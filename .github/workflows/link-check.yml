name: link-check

# 每周一 02:00 UTC 检查一遍外链；失败会让 Action 变红，等于给你发提醒邮件
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 这里**不要再写 version**：package.json 的 `packageManager: pnpm@11.7.0` 已经定了版本，
      # 两处都写 pnpm/action-setup 会直接报「Multiple versions of pnpm specified」并让本步骤失败
      # （2026-10-05 与 10-12 两次定时任务就是这么红的，后面的 check:links 根本没跑到）。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 24：check:links 的代理支持依赖 fetch 读取 NODE_USE_ENV_PROXY
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # GitHub 的 runner 直连 huggingface.co 没问题，一般不需要代理。
      # 若你的 runner 需要走代理，取消下面两行的注释并在仓库里配置 HTTPS_PROXY secret；
      # 不需要代理时**不要**配这个 secret，否则脚本会误以为该走代理。
      # env:
      #   HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
      - run: pnpm check:links